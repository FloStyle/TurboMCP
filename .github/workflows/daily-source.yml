name: Daily source release
on:
  workflow_run:
    workflows: [Repository validation]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: daily-source-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'FloStyle/TurboMCP' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check publication decisions
        run: python Tools/test-daily-release.py
      - name: Publish daily source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/daily_release.py
