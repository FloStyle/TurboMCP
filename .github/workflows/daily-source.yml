name: Daily source release
on:
  workflow_run:
    workflows: [Repository validation]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: daily-source-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'FloStyle/TurboMCP' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check publication decisions
        run: python Tools/test-daily-release.py
      - name: Publish daily source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/daily_release.py
