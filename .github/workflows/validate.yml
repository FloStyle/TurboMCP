name: Repository validation
on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Normalize temporary directory identity
        shell: pwsh
        run: |
          $resolvedTemp = python -c "from pathlib import Path; import tempfile; print(Path(tempfile.gettempdir()).resolve())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TEMP=$resolvedTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$resolvedTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Structure and focused offline regressions
        shell: pwsh
        run: |
          python Tools/validate.py
          $validationExit = $LASTEXITCODE
          if ($validationExit -ne 0) {
            $report = Get-ChildItem .local/validation/*/report.json | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($report) {
              $results = (Get-Content -LiteralPath $report.FullName -Raw | ConvertFrom-Json).results
              foreach ($failed in ($results | Where-Object exit_code -ne 0)) {
                Write-Output "Failed check: $($failed.id)"
                Get-Content -LiteralPath $failed.log
              }
            }
            exit $validationExit
          }
      - name: Public boundary preview (never publishes)
        shell: pwsh
        run: |
          python Tools/export-public.py --preview --output .local/public-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
