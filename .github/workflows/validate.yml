name: Repository validation
on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Structure and focused offline regressions
        shell: pwsh
        run: |
          python Tools/validate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public boundary preview (never publishes)
        shell: pwsh
        run: |
          python Tools/export-public.py --preview --output .local/public-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
