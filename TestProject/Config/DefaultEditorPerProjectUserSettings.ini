; TurboMCP test project settings that the engine stores per user, per project.
;
; Why this file and not DefaultEngine.ini: UModelContextProtocolSettings is
; declared UCLASS(config=EditorPerProjectUserSettings). The engine reads a
; config property from the class's own config file, so this section in
; DefaultEngine.ini was silently ignored. Verified against
; ModelContextProtocolSettings.cpp ShouldAutoStartServer(), which reads
; GetDefault<UModelContextProtocolSettings>()->bAutoStartServer.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; The MCP server must be running for an agent to reach TurboMCP at all, and
; 07_ENGINE_NOTES.md section 2.2 records that the engine default is off. Turning
; it on here means the server is up on editor start, so a test run needs no
; manual step a person could forget.
;
; This has no effect in a commandlet: ShouldAutoStartServer returns false there
; on purpose, because a cook would race a running editor for the port. To start
; the server in a commandlet, pass -ModelContextProtocolStartServer.
bAutoStartServer=True

; Tool search on is the engine default and is kept. With it on a client sees only
; list_toolsets, describe_toolset and call_tool, and reaches every TurboMCP tool
; through call_tool with the toolset name. TurboMCP's own help tools are written
; for that mode, so this must not be flipped without re-testing them.
bEnableToolSearch=True

; Default server address, kept explicit so the port a test connects to is
; written down in the project rather than remembered. The command line can
; override the port with -ModelContextProtocolPort=<n>.
ServerPortNumber=8000
ServerUrlPath=/mcp
