; TurboMCP test project engine settings.
;
; Deliberately almost empty. The plugin's own settings live in
; DefaultEditorPerProjectUserSettings.ini, because UModelContextProtocolSettings
; is declared config=EditorPerProjectUserSettings and the engine reads it from
; that file, not from here. Putting them in this file silently does nothing.
;
; See ./DefaultEditorPerProjectUserSettings.ini for the MCP server settings.
;
; No map is named here on purpose. 06_ACCEPTANCE.md controls what the test assets
; are, and TA-1 to TA-13 are built by hand in the editor. Naming a startup map
; that does not exist yet would make the editor fail to open it, so the startup
; map is left to the editor default until the test kit is built.

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
; *** THE SECURITY TOKEN IS DELIBERATELY EMPTY, AND THE KEY IS KEPT SO NOBODY RE-ADDS ONE BY HAND. ***
;
; The engine writes a RANDOM token here when a project is created, and the first version of this file
; carried one - and it was NOT the engine's own default, so it was generated rather than copied. A
; generated token is a SECRET, and a secret in a public repository is a secret that has been published.
; THE OLD VALUE IS NOT REPRODUCED HERE, because writing it in a comment would publish it just as surely
; as leaving it in the setting.
;
; IT IS REMOVED RATHER THAN REPLACED, because NOTHING HERE USES IT. The plugin is not listed in
; `TurboMCPTest.uproject`, the connection type is `USBOnly`, and the file server is never started - so the
; token granted access to an Android file server this project does not run. An empty token disables the
; file server by the engine's own rule: `AndroidFileServerRuntimeSettings.h` documents `SecurityToken` as
; "Optional security token required to start FileServer (leave empty to disable)".
;
; AND THE VALUE IS PURGED FROM THE HISTORY AS WELL, because deleting it here is not enough: an earlier
; commit still carried it, and `git log -p` would have published it anyway.
SecurityToken=
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


; LIVE CODING IS DISABLED ON PURPOSE, AND THIS IS A FOCUS FIX RATHER THAN A BUILD SETTING.
; LiveCodingConsole calls BringToFront BY DESIGN - LiveCodingConsole.cpp binds BringToFront and
; BringToFrontAsync to the server's own ShowConsole and BringToFront delegates, and MainThreadTasks
; runs BringToFront - and it is launched WITH -Hidden (LiveCodingModule.cpp:1104), WHICH IS WHY AN
; ENUMERATION OF VISIBLE WINDOWS NEVER SAW IT. Every BUILD spawned it and it took the foreground.
[/Script/LiveCoding.LiveCodingSettings]
bEnableLiveCoding=False

; CommonUI input routing requires its viewport client in the test project.
[/Script/Engine.Engine]
GameViewportClientClassName=/Script/CommonUI.CommonGameViewportClient
