name: Repository validation
on:
  push:
    branches: [main, 'migration/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Structure and focused offline regressions
        shell: pwsh
        run: |
          $checks = @('validate-repo.py', 'test-client-retry.py', 'test-result-contract.py', 'test-coverage-audit.py', 'test-runner-verdicts.py', 'test-lookup-guards.py', 'test-widget-tree-nested.py', 'test-traps-plugin-identity.py', 'test-repo-boundaries.py', 'test-build-provenance.py')
          foreach ($check in $checks) {
            python "Tools/$check"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Public boundary preview (never publishes)
        run: python Tools/export-public.py --preview --output .local/public-preview
